# Cloudflare Worker — TMKE R2 deliverables API
# ---------------------------------------------------------------------------
# A tiny upload/download backend bound directly to the R2 bucket. No secret
# keys live here — the `BUCKET` binding gives the Worker native R2 access.
# Requests are authenticated by validating the caller's Supabase session token.
#
# Deploy:
#   cd worker
#   npm install
#   npx wrangler deploy
# Then copy the deployed URL into the site's PUBLIC_R2_WORKER_URL env var.
# ---------------------------------------------------------------------------

name = "tmke-deliverables-api"
main = "src/index.js"
compatibility_date = "2024-09-23"
# node:buffer etc. for @cloudflare/puppeteer (invoice PDF rendering). Additive.
compatibility_flags = ["nodejs_compat"]

# Native binding to your existing bucket — no Access Key / Secret needed.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tmke-deliverables"

# Set CF_ACCOUNT_ID in [vars] to turn on the "Open in Cloudflare" link on a
# shoot's archive folder. It is the long hex string in every dashboard URL:
# dash.cloudflare.com/<THIS>/r2/... Without it the admin shows the folder path
# but offers no link, rather than offering one that 404s.

# Public assets bucket (assets.tmke.co.uk) — read-only listing for the live
# "Jack - headshots" Agent gallery (/headshots endpoint).
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "tmke-assets"

# Browser Rendering (headless Chrome) — turns invoice HTML into a real A4 PDF
# for the invoice-send flow. Requires the Workers Paid plan.
[browser]
binding = "BROWSER"

[vars]
# Used to validate the caller's Supabase login (anon key is public — safe here).
SUPABASE_URL = "https://tqqezhvjakohraiverei.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxcWV6aHZqYWtvaHJhaXZlcmVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTUyODAsImV4cCI6MjA5NDU5MTI4MH0.Ng03JuGuJeI_Zg8J3sVZ_9EIEqQh_K44Bla03uR8-wk"
# Comma-separated list of allowed site origins (CORS). Use * only for local dev.
