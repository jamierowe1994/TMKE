# Cloudflare Worker — TMKE R2 deliverables API
# ---------------------------------------------------------------------------
# A tiny upload/download backend bound directly to the R2 bucket. No secret
# keys live here — the `BUCKET` binding gives the Worker native R2 access.
# Requests are authenticated by validating the caller's Supabase session token.
#
# Deploy:
#   cd worker
#   npm install
#   npx wrangler deploy
# Then copy the deployed URL into the site's PUBLIC_R2_WORKER_URL env var.
# ---------------------------------------------------------------------------

name = "tmke-deliverables-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Native binding to your existing bucket — no Access Key / Secret needed.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tmke-deliverables"

# Public assets bucket (assets.tmke.co.uk) — read-only listing for the live
# "Jack - headshots" Agent gallery (/headshots endpoint).
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "tmke-assets"

[vars]
# Used to validate the caller's Supabase login (anon key is public — safe here).
SUPABASE_URL = "https://tqqezhvjakohraiverei.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxcWV6aHZqYWtvaHJhaXZlcmVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTUyODAsImV4cCI6MjA5NDU5MTI4MH0.Ng03JuGuJeI_Zg8J3sVZ_9EIEqQh_K44Bla03uR8-wk"
# Comma-separated list of allowed site origins (CORS). Use * only for local dev.
ALLOWED_ORIGINS = "http://localhost:4321,http://localhost:4322,https://tmke.co.uk,https://www.tmke.co.uk,https://tmke-production.up.railway.app"

# Microsoft 365 booking (app-only). Client ID + tenant + Jack's mailbox are NOT
# secret. The client secret is set separately: `wrangler secret put MS_CLIENT_SECRET`.
MS_CLIENT_ID = "543c20ac-6cf8-4191-96ca-3d83d775d3fb"
MS_TENANT_ID = "bd9416b6-3621-41ee-bc8f-6ad7988c0618"
JACK_UPN = "jack@tmke.co.uk"

# Transactional email (enquiry/booking/discovery confirmations + Jack alerts) is
# sent via Microsoft 365 Graph `sendMail` from this mailbox — so it comes from
# our own address, replies land in the inbox, and a copy sits in Sent Items.
# Requires the `Mail.Send` application permission on the Entra app (admin-consented).
MAIL_SENDER = "hello@tmke.co.uk"
MAIL_FROM_NAME = "TMKE"

# SMM brochure (Form 1) — the link emailed on every brochure request. Upload the
# PDF to the assets bucket, then point this at it. Until then the link 404s but
# the form, lead capture, and email still work.
SMM_BROCHURE_URL = "https://assets.tmke.co.uk/tmke-smm-brochure.pdf"

# Scheduled-post reminder emails (cron) still use Resend. The verified sender address.
MAIL_FROM = "TMKE <posts@tmke.co.uk>"

# Social Media (SMM) discovery-call calendar. Abigail's mailbox is on a separate
# M365 tenant (themarketingexperts.co.uk) so the app can't book it directly —
# INTERIM: book into hello@ (in-tenant, already calendar-accessible) and notify
# Abigail + add her as an event attendee so the invite lands in her diary.
# Repoint to a tmke.co.uk mailbox for her when she's on the scheme.
SMM_MANAGER_UPN = "hello@tmke.co.uk"
SMM_NOTIFY = "Abigail.Saunders@themarketingexperts.co.uk"

# Booking confirmations: public site (for "manage your booking" links) and the
# internal address that gets the new-booking notification (defaults to JACK_UPN).
SITE_URL = "https://tmke.co.uk"
JACK_NOTIFY = "jack@tmke.co.uk"

# Google Distance Matrix (travel surcharge) — key is a secret:
#   wrangler secret put GOOGLE_MAPS_API_KEY

# AI text parser (studio "Read text with AI"). Model is public; the key is a secret.
AI_MODEL = "claude-sonnet-4-6"

# Cron triggers (scheduled() branches on event.cron):
#   "0 7 * * *"   — 07:00 UTC daily: post reminders (asset emails due that day).
#   "*/5 * * * *" — every 5 min: advance due marketing-automation enrolments
#                   (waits/drips, sends). Keeps automations responsive.
[triggers]
crons = ["0 7 * * *", "*/5 * * * *"]

# Secrets to set (not stored here):
#   wrangler secret put MS_CLIENT_SECRET       # Entra app client secret
#   wrangler secret put SUPABASE_SERVICE_ROLE  # Supabase service_role key
#   wrangler secret put RESEND_API_KEY         # Resend API key (reminder emails)
#   wrangler secret put ANTHROPIC_API_KEY      # Claude API key (sk-ant-…) for the AI text parser
#   wrangler secret put TURNSTILE_SECRET_KEY   # Cloudflare Turnstile secret (SMM form spam protection)
#   wrangler secret put RAILWAY_DEPLOY_HOOK     # Railway Deploy Hook URL — POSTing to it rebuilds the static
#                                               # site so published/edited blogs go live (powers the /deploy route)
# Site env also needs PUBLIC_TURNSTILE_SITE_KEY (public, in .env / Railway) for the widget.
