SMM_NOTIFY = "Abigail.Saunders@themarketingexperts.co.uk"

# Booking confirmations: public site (for "manage your booking" links) and the
# internal address that gets the new-booking notification (defaults to JACK_UPN).
SITE_URL = "https://tmke.co.uk"
JACK_NOTIFY = "jack@tmke.co.uk"

# Who gets told about a general /contact enquiry. Videography goes to Jack and
# social to Abigail; this is the catch-all form, so it lands in the shared
# inbox. Change to a person's address if it starts getting missed.
ENQUIRY_NOTIFY = "hello@tmke.co.uk"

# Google Distance Matrix (travel surcharge) — key is a secret:
#   wrangler secret put GOOGLE_MAPS_API_KEY

# AI text parser (studio "Read text with AI"). Model is public; the key is a secret.
AI_MODEL = "claude-sonnet-4-6"

# Cron triggers (scheduled() branches on event.cron):
#   "0 7 * * *" & "0 8 * * *" — 07:00 & 08:00 UTC daily: post reminders.
#                   runReminders self-gates to 8am UK, so it fires at 8am across
#                   BST (=07:00 UTC) and GMT (=08:00 UTC).
#   "*/5 * * * *" — every 5 min: advance due marketing-automation enrolments
#                   (waits/drips, sends). Keeps automations responsive.
[triggers]
crons = ["0 7 * * *", "0 8 * * *", "*/5 * * * *"]

# ---------------------------------------------------------------------------
# Route: put the unsubscribe page on the real domain.
#
# /unsubscribe is served by this Worker, not by the Astro site on Railway, so
# without this route tmke.co.uk/unsubscribe would 404 and the only working link
# would be the *.workers.dev one — which reads as phishing to recipients and to
# spam filters, exactly the wrong signal on marketing mail.
#
# Narrow on purpose: it claims /unsubscribe and nothing else, so every other
# path on tmke.co.uk still goes to Railway as before. Takes effect on the next
# `npx wrangler deploy`.
# ---------------------------------------------------------------------------
# DO NOT add a [[routes]] block here without also proving the workers.dev
# subdomain survives it.
#
# On 27 Jul 2026 a route for tmke.co.uk/unsubscribe* was added. Declaring any
# route flips workers_dev OFF by default, and the entire site reaches this
# Worker at https://tmke-deliverables-api.tmke.workers.dev (PUBLIC_R2_WORKER_URL).
# The subdomain vanished, and with it every API the site depends on: bookings
# and enquiries failed with "Failed to fetch", the availability picker showed
# "couldn't load the times". Setting workers_dev = true did not bring it back
# within several minutes, so the route was removed to restore service.
#
# The unsubscribe page is served on the workers.dev URL instead - see
# unsubBase() in src/index.js. Putting it on tmke.co.uk is still worth doing
# (a *.workers.dev unsubscribe link looks like phishing), but it needs the
# subdomain re-enabled in the dashboard FIRST, and testing outside business
# hours.

# Secrets to set (not stored here):
#   wrangler secret put MS_CLIENT_SECRET       # Entra app client secret
#   wrangler secret put SUPABASE_SERVICE_ROLE  # Supabase service_role key
#   wrangler secret put RESEND_API_KEY         # Resend API key (reminder emails)
#   wrangler secret put ANTHROPIC_API_KEY      # Claude API key (sk-ant-…) for the AI text parser
#   wrangler secret put TURNSTILE_SECRET_KEY   # Cloudflare Turnstile secret (SMM form spam protection)
#   wrangler secret put RAILWAY_API_TOKEN       # Railway API token — lets /deploy redeploy the site so
#                                               # published/edited blogs go live (Railway has no incoming hook URL)
#   wrangler secret put STRIPE_SECRET_KEY       # Stripe secret key (sk_test_… in sandbox) — server-side only
#   wrangler secret put STRIPE_WEBHOOK_SECRET   # Stripe webhook signing secret (whsec_…) for /stripe/webhook
# Site env also needs PUBLIC_TURNSTILE_SITE_KEY (public, in .env / Railway) for the widget, and
# PUBLIC_STRIPE_PUBLISHABLE_KEY (pk_test_…) is set on the SITE (Railway), not here.
