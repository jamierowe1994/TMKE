# Lock Railway's Nixpacks build to Node so it doesn't get confused by
# the Deno-flavoured Supabase Edge Functions under `supabase/functions/`.
# Those run on Supabase's own runtime, not in this build, and shouldn't
# influence language detection here.

providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "npm-10_x"]
