<?xml version="1.0" encoding="UTF-8"?>
<!-- The empty photo slot.
     Where an agent's brand-approved headshot goes before we hold one.
     Deliberately a silhouette and not a stock person: it has to read as "a
     photograph belongs here", never as a photograph.

     Proportioned 4:5 and cropped at the waist, because that is the shape the
     real ones arrive in - 1000x1250 out of Rex, chest-up, the same picture
     that goes on a for-sale board. A design laid out against this still holds
     when the real photograph lands. Transparent ground; the dashes are the
     slot, not the picture. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Where your photo will go">
  <rect x="7" y="7" width="986" height="1236" rx="14"
        fill="none" stroke="#371e28" stroke-opacity="0.22"
        stroke-width="6" stroke-dasharray="26 20" />
  <g fill="#371e28" fill-opacity="0.16">
    <ellipse cx="500" cy="358" rx="152" ry="181" />
    <path d="M500 560c-40 0-78 6-113 19l-96 35c-71 26-116 94-116 170v466h650V784c0-76-45-144-116-170l-96-35c-35-13-73-19-113-19z" />
  </g>
</svg>
