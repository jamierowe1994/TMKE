<?xml version="1.0" encoding="UTF-8"?>
<!-- The empty photo slot.
     Shown where an agent's brand-approved photo will go, before we hold one.
     Deliberately a silhouette and not a stock person: it has to read as "a
     photograph belongs here", never as a photograph. Proportioned to a
     standing adult at roughly 1:2.33, which is the shape a cut-out actually
     arrives in, so a design laid out against this still holds when the real
     one lands. Transparent ground; the dashes are the slot, not the picture. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1400" width="600" height="1400" role="img" aria-label="Where your photo will go">
  <rect x="6" y="6" width="588" height="1388" rx="10"
        fill="none" stroke="#371e28" stroke-opacity="0.22"
        stroke-width="4" stroke-dasharray="18 14" />
  <g fill="#371e28" fill-opacity="0.16">
    <ellipse cx="300" cy="188" rx="74" ry="88" />
    <path d="M300 286c-14 0-26 2-38 6l-70 26c-26 10-42 34-42 62v300c0 14 11 25 25 25s25-11 25-25V450l16-6v246c0 8 6 14 14 14h140c8 0 14-6 14-14V444l16 6v230c0 14 11 25 25 25s25-11 25-25V380c0-28-16-52-42-62l-70-26c-12-4-24-6-38-6z" />
    <path d="M232 722h58c8 0 14 6 14 14v574c0 14-11 25-25 25h-36c-14 0-25-11-25-25V736c0-8 6-14 14-14z" />
    <path d="M310 722h58c8 0 14 6 14 14v574c0 14-11 25-25 25h-36c-14 0-25-11-25-25V736c0-8 6-14 14-14z" />
  </g>
</svg>
